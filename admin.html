<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Newsletter — Team Group</title>
    <link rel="icon" href="img/logo.png">
    <link rel="stylesheet" href="css/style.css">
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        .admin-login { max-width: 400px; margin: 120px auto; padding: 40px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; }
        .admin-login h2 { text-align: center; margin-bottom: 24px; }
        .admin-login input { width: 100%; padding: 12px 16px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font: inherit; margin-bottom: 12px; box-sizing: border-box; }
        .admin-panel { display: none; }
        .admin-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 32px; }
        .admin-stat { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; text-align: center; }
        .admin-stat .num { font-size: 1.8rem; font-weight: 800; color: var(--accent); }
        .admin-stat .label { color: var(--text-dim); font-size: .8rem; margin-top: 4px; }
        .sub-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 20px; margin-bottom: 10px; cursor: pointer; transition: border-color .2s; }
        .sub-card:hover { border-color: var(--accent); }
        .sub-header { display: flex; justify-content: space-between; align-items: center; }
        .sub-email { font-weight: 700; font-size: 1rem; }
        .sub-date { color: var(--text-dim); font-size: .82rem; }
        .sub-details { display: none; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
        .sub-details.open { display: block; }
        .sub-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px 16px; }
        .sub-field { font-size: .85rem; }
        .sub-field .k { color: var(--text-dim); }
        .sub-field .v { color: var(--text); font-weight: 500; word-break: break-all; }
        .sub-actions { margin-top: 12px; display: flex; gap: 8px; }
        .sub-actions button { font-size: .82rem; padding: 6px 12px; border-radius: 8px; cursor: pointer; border: 1px solid var(--border); background: var(--bg); color: var(--text); }
        .sub-actions .del { border-color: var(--red); color: var(--red); }
        .sub-actions .del:hover { background: var(--red); color: #fff; }
        .events-list { margin-top: 12px; }
        .event-item { font-size: .8rem; padding: 6px 0; border-bottom: 1px solid var(--border); color: var(--text-dim); }
        .event-item:last-child { border-bottom: none; }
        .event-type { font-weight: 600; color: var(--text); text-transform: uppercase; font-size: .72rem; letter-spacing: .5px; }
        .badge { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: .72rem; font-weight: 600; }
        .badge-active { background: rgba(34,197,94,.15); color: #22c55e; }
        .badge-inactive { background: rgba(239,68,68,.15); color: #ef4444; }
        .filter-bar { display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
        .filter-bar input, .filter-bar select { padding: 8px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font: inherit; font-size: .85rem; }
        .filter-bar input { flex: 1; min-width: 200px; }
    </style>
</head>
<body>
<a class="skip-to-content" href="#main-content">Aller au contenu principal</a>

<header>
    <div class="navbar">
        <a class="brand" href="index.html">
            <img src="img/logo.png" alt="Team Group">
            <div class="brand-dot"></div>
            Team Group
        </a>
        <nav>
            <a href="index.html">Retour au site</a>
        </nav>
    </div>
</header>

<main id="main-content">
    <section class="section" style="padding-top:48px;">
        <div class="section-header">
            <div class="label">Administration</div>
            <h2>Newsletter — Postgres</h2>
        </div>

        <div id="login-form" class="admin-login">
            <h2>Connexion</h2>
            <input type="password" id="admin-key" placeholder="Clé d'administration" autofocus>
            <button class="btn btn-primary" style="width:100%;" onclick="login()">Se connecter</button>
            <p id="login-error" style="color:var(--red); text-align:center; margin-top:12px; display:none; font-size:.85rem;"></p>
        </div>

        <div id="admin-panel" class="admin-panel">
            <div class="admin-stats">
                <div class="admin-stat">
                    <div class="num" id="stat-active">0</div>
                    <div class="label">Abonnés actifs</div>
                </div>
                <div class="admin-stat">
                    <div class="num" id="stat-total">0</div>
                    <div class="label">Total (total ever)</div>
                </div>
                <div class="admin-stat">
                    <div class="num" id="stat-today">0</div>
                    <div class="label">Aujourd'hui</div>
                </div>
                <div class="admin-stat">
                    <div class="num" id="stat-week">0</div>
                    <div class="label">Cette semaine</div>
                </div>
            </div>

            <div class="filter-bar">
                <input type="text" id="search" placeholder="Rechercher un email..." oninput="filterList()">
                <select id="filter-status" onchange="filterList()">
                    <option value="all">Tous</option>
                    <option value="active">Actifs</option>
                    <option value="inactive">Désabonnés</option>
                </select>
            </div>

            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
                <h3 id="list-title">Liste des abonnés</h3>
                <button class="btn btn-ghost" onclick="loadAll()">Rafraîchir</button>
            </div>

            <div id="subscriber-list"></div>
        </div>

        <div id="newsletter-panel" style="margin-top:48px; display:none;">
            <div class="section-header">
                <div class="label">Envoi</div>
                <h2>Envoyer une newsletter</h2>
            </div>

            <div style="background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:24px;">
                <div style="margin-bottom:16px;">
                    <label style="display:block; margin-bottom:6px; color:var(--text-dim); font-size:.85rem;">Destinataires</label>
                    <select id="send-target" style="width:100%; padding:10px 14px; background:var(--bg); border:1px solid var(--border); border-radius:8px; color:var(--text); font:inherit;">
                        <option value="all">Tous les abonnés actifs</option>
                        <option value="test">Email de test (ci-dessous)</option>
                    </select>
                </div>
                <div id="test-email-field" style="margin-bottom:16px; display:none;">
                    <label style="display:block; margin-bottom:6px; color:var(--text-dim); font-size:.85rem;">Email de test</label>
                    <input type="email" id="test-email" placeholder="test@example.com" style="width:100%; padding:10px 14px; background:var(--bg); border:1px solid var(--border); border-radius:8px; color:var(--text); font:inherit; box-sizing:border-box;">
                </div>
                <div style="margin-bottom:16px;">
                    <label style="display:block; margin-bottom:6px; color:var(--text-dim); font-size:.85rem;">Sujet</label>
                    <input type="text" id="send-subject" placeholder="Alerte sécurité critique..." style="width:100%; padding:10px 14px; background:var(--bg); border:1px solid var(--border); border-radius:8px; color:var(--text); font:inherit; box-sizing:border-box;">
                </div>
                <div style="margin-bottom:16px;">
                    <label style="display:block; margin-bottom:6px; color:var(--text-dim); font-size:.85rem;">Contenu HTML</label>
                    <textarea id="send-html" rows="8" placeholder="<h2>Alerte CVE</h2><p>Une nouvelle vulnérabilité critique a été découverte...</p>" style="width:100%; padding:10px 14px; background:var(--bg); border:1px solid var(--border); border-radius:8px; color:var(--text); font:inherit; box-sizing:border-box; resize:vertical; font-family:monospace; font-size:.85rem;"></textarea>
                </div>
                <div style="display:flex; gap:8px; align-items:center;">
                    <button class="btn btn-primary" id="send-btn" onclick="sendNewsletter()">Envoyer</button>
                    <span id="send-message" style="font-size:.85rem;"></span>
                </div>
            </div>
        </div>
    </section>
</main>

<script>
let ADMIN_KEY = '';
let ALL_SUBS = [];

function login() {
    ADMIN_KEY = document.getElementById('admin-key').value.trim();
    if (!ADMIN_KEY) return;
    loadAll();
}

async function loadAll() {
    const errEl = document.getElementById('login-error');
    errEl.style.display = 'none';

    try {
        const [subsRes, statsRes] = await Promise.all([
            fetch('/api/subscribers', { headers: { 'Authorization': 'Bearer ' + ADMIN_KEY } }),
            fetch('/api/subscribers?action=stats', { headers: { 'Authorization': 'Bearer ' + ADMIN_KEY } })
        ]);

        const subsData = await subsRes.json();
        const statsData = await statsRes.json();

        if (subsRes.status === 401) {
            errEl.textContent = 'Clé invalide.';
            errEl.style.display = 'block';
            return;
        }

        document.getElementById('login-form').style.display = 'none';
        document.getElementById('admin-panel').style.display = 'block';
        document.getElementById('newsletter-panel').style.display = 'block';

        document.getElementById('stat-active').textContent = statsData.active || subsData.count || 0;
        document.getElementById('stat-total').textContent = statsData.total || 0;
        document.getElementById('stat-today').textContent = statsData.today || 0;
        document.getElementById('stat-week').textContent = statsData.thisWeek || 0;

        ALL_SUBS = subsData.subscribers || [];
        renderList(ALL_SUBS);
    } catch (e) {
        errEl.textContent = 'Erreur réseau.';
        errEl.style.display = 'block';
    }
}

function filterList() {
    const q = document.getElementById('search').value.toLowerCase();
    const status = document.getElementById('filter-status').value;
    let filtered = ALL_SUBS;
    if (q) filtered = filtered.filter(s => s.email.includes(q));
    if (status === 'active') filtered = filtered.filter(s => s.active);
    if (status === 'inactive') filtered = filtered.filter(s => !s.active);
    renderList(filtered);
}

function renderList(subs) {
    document.getElementById('list-title').textContent = 'Abonnés (' + subs.length + ')';
    const list = document.getElementById('subscriber-list');
    list.innerHTML = '';

    subs.forEach(function(sub) {
        const d = new Date(sub.subscribed_at);
        const card = document.createElement('div');
        card.className = 'sub-card';
        card.innerHTML =
            '<div class="sub-header">' +
                '<div><span class="sub-email">' + escH(sub.email) + '</span> ' +
                (sub.active ? '<span class="badge badge-active">Actif</span>' : '<span class="badge badge-inactive">Désabonné</span>') +
                '</div>' +
                '<span class="sub-date">' + d.toLocaleDateString('fr-FR') + ' ' + d.toLocaleTimeString('fr-FR') + '</span>' +
            '</div>' +
            '<div class="sub-details" id="det-' + sub.id + '">' +
                '<div class="sub-grid">' +
                    field('Email', sub.email) +
                    field('Source', sub.source) +
                    field('IP', sub.ip_address) +
                    field('Pays / Ville', (sub.country || '?') + ' / ' + (sub.city || '?')) +
                    field('Navigateur', sub.browser) +
                    field('OS', sub.os) +
                    field('Appareil', sub.device) +
                    field('Page visitée', sub.page_visited) +
                    field('Référent', sub.referer) +
                    field('User-Agent', sub.user_agent) +
                    field('Inscrit le', d.toLocaleString('fr-FR')) +
                    field('Désabonné', sub.unsubscribed_at ? new Date(sub.unsubscribed_at).toLocaleString('fr-FR') : '-') +
                    field('Raison désabonnement', sub.unsubscription_reason || '-') +
                '</div>' +
                '<div class="sub-actions">' +
                    '<button onclick="toggleEvents(' + sub.id + ')">Événements</button>' +
                    '<button class="del" onclick="deleteSub(\'' + escH(sub.email) + '\')">Supprimer</button>' +
                '</div>' +
                '<div class="events-list" id="events-' + sub.id + '"></div>' +
            '</div>';

        card.querySelector('.sub-header').addEventListener('click', function() {
            document.getElementById('det-' + sub.id).classList.toggle('open');
        });

        list.appendChild(card);
    });
}

function field(label, value) {
    return '<div class="sub-field"><span class="k">' + label + ' : </span><span class="v">' + escH(value || '-') + '</span></div>';
}

function escH(s) {
    const d = document.createElement('div');
    d.textContent = s || '';
    return d.innerHTML;
}

async function toggleEvents(subId) {
    const el = document.getElementById('events-' + subId);
    if (el.innerHTML) { el.innerHTML = ''; return; }
    try {
        const res = await fetch('/api/subscribers?action=events&subscriber_id=' + subId, {
            headers: { 'Authorization': 'Bearer ' + ADMIN_KEY }
        });
        const data = await res.json();
        if (!data.events || data.events.length === 0) {
            el.innerHTML = '<div class="event-item">Aucun événement</div>';
            return;
        }
        el.innerHTML = data.events.map(function(ev) {
            const d = new Date(ev.created_at);
            return '<div class="event-item"><span class="event-type">' + ev.event_type + '</span> — ' +
                d.toLocaleString('fr-FR') + ' · IP: ' + (ev.ip_address || '?') +
                (ev.metadata ? ' · ' + JSON.stringify(ev.metadata) : '') + '</div>';
        }).join('');
    } catch (e) {
        el.innerHTML = '<div class="event-item">Erreur de chargement</div>';
    }
}

async function deleteSub(email) {
    if (!confirm('Supprimer ' + email + ' ?')) return;
    await fetch('/api/subscribers?email=' + encodeURIComponent(email), {
        method: 'DELETE',
        headers: { 'Authorization': 'Bearer ' + ADMIN_KEY }
    });
    loadAll();
}

document.getElementById('admin-key').addEventListener('keyup', function(e) {
    if (e.key === 'Enter') login();
});

document.getElementById('send-target').addEventListener('change', function() {
    document.getElementById('test-email-field').style.display = this.value === 'test' ? 'block' : 'none';
});

async function sendNewsletter() {
    const target = document.getElementById('send-target').value;
    const subject = document.getElementById('send-subject').value.trim();
    const html = document.getElementById('send-html').value.trim();
    const msgEl = document.getElementById('send-message');
    const btn = document.getElementById('send-btn');

    if (!subject || !html) { msgEl.innerHTML = '<span style="color:var(--red);">Sujet et contenu requis.</span>'; return; }

    const body = { subject, html };
    if (target === 'test') {
        body.testEmail = document.getElementById('test-email').value.trim();
        if (!body.testEmail) { msgEl.innerHTML = '<span style="color:var(--red);">Email de test requis.</span>'; return; }
    }

    btn.disabled = true; btn.textContent = 'Envoi...';
    msgEl.innerHTML = '';

    try {
        const res = await fetch('/api/send-newsletter', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + ADMIN_KEY },
            body: JSON.stringify(body)
        });
        const data = await res.json();
        if (data.success) {
            msgEl.innerHTML = '<span style="color:var(--green);">' + data.message + '</span>';
        } else {
            msgEl.innerHTML = '<span style="color:var(--red);">' + (data.error || 'Erreur lors de l\'envoi.') + '</span>';
        }
    } catch (e) {
        msgEl.innerHTML = '<span style="color:var(--red);">Erreur réseau.</span>';
    }
    btn.disabled = false; btn.textContent = 'Envoyer';
}
</script>

</body>
</html>
